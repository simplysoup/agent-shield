[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agentshield-demo"
version = "0.1.0"
description = "Synthetic agent security enforcement and opt-in adversarial evaluation infrastructure"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["langgraph>=0.3,<2", "langchain-core>=0.3,<2"]
models = ["openai>=1.70,<3", "langchain-openai>=0.3,<2", "python-dotenv>=1,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.scripts]
agentshield = "agentshield.cli:main"
agentshield-eval = "agentshield.evaluation.launch:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
